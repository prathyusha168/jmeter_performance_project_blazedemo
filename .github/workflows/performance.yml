name: JMeter Performance Test

on:
  push:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Java
        run: java -version

      - name: Download JMeter
        run: |
          curl -L -o jmeter.zip https://archive.apache.org/dist/jmeter/binaries/apache-jmeter-5.6.3.zip
          powershell Expand-Archive jmeter.zip -DestinationPath .

      - name: Show Files
        run: dir